name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint ja testit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Asenna kirjastot
        run: python -m pip install -r requirements-dev.txt

      - name: Tarkista koodi
        run: ruff check .

      - name: Aja testit
        run: python -m pytest

      - name: Tarkista skriptit
        run: |
          bash -n scripts/server-setup.sh
          bash -n scripts/deploy.sh

  deploy:
    name: Julkaise palvelimelle A
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: chatapp-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.CPOUTA_HOST }}
      DEPLOY_USER: ${{ secrets.CPOUTA_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Valmistele SSH
        env:
          SSH_KEY: ${{ secrets.CPOUTA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPOUTA_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host cpouta
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Kopioi sovellus
        run: |
          rsync -az --delete --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='.ruff_cache/' \
            --exclude='REVISION' \
            ./ cpouta:/opt/chatapp/app/

      - name: Julkaise
        run: ssh cpouta "bash /opt/chatapp/app/scripts/deploy.sh $GITHUB_SHA"

      - name: Tarkista julkaisu
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            actual=$(curl -fsS "http://$DEPLOY_HOST/viikko5/health" || true)
            if [ "$actual" = "$GITHUB_SHA" ]; then
              break
            fi
            sleep 3
          done
          test "$actual" = "$GITHUB_SHA"
          curl -fsS "http://$DEPLOY_HOST/viikko5/" | grep -q 'id="chat-form"'
          curl -fsS -o /dev/null "http://$DEPLOY_HOST/viikko5/static/app.js"

      - name: Näytä palvelimen resurssit
        run: ssh cpouta "free -h; lscpu"

      - name: Näytä GitHub-ajokoneen resurssit
        run: |
          free -h
          lscpu
