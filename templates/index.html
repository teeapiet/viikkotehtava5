<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 5 – AI Chat</title>
  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css', v='3') }}">
  <script defer
          src="{{ url_for('static', filename='app.js', v='3') }}"></script>
</head>
<body data-base="{{ request.script_root }}">
  <main>
    <header>
      <p class="label">LINUX · WEEKLY ASSIGNMENT 5</p>
      <h1>My AI Chat</h1>
      <p>Model: {{ model }} · Ollama on Server A</p>
    </header>

    <p class="notice">
      This is a public course demo. Do not share personal information
      or passwords. Messages are stored in the server database.
    </p>

    <section id="messages"
             aria-label="Conversation"
             aria-live="polite"></section>

    <form id="chat-form">
      <label for="message">Your message</label>
      <textarea id="message" maxlength="2000" rows="3" required
                placeholder="Ask a question about Linux commands"></textarea>
      <div class="buttons">
        <button id="send" type="submit">Send</button>
        <button id="clear" class="secondary" type="button">
          Delete conversation
        </button>
      </div>
    </form>

    <p id="status" role="status">Loading conversation…</p>
  </main>
</body>
</html>
